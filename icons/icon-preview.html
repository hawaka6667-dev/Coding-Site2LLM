<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Site2LLM icon candidates</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #eef2f5;
      color: #17212b;
    }

    body {
      margin: 0;
      padding: 36px;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      margin: 0 0 24px;
      color: #53616d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .candidate {
      padding: 20px;
      border: 1px solid #cbd5dc;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 24px #17212b12;
    }

    .candidate h2 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .swatches {
      display: flex;
      align-items: center;
      justify-content: space-around;
      min-height: 196px;
      border-radius: 7px;
      background: #f5f7f8;
    }

    .swatches.dark {
      background: #182331;
    }

    .icon {
      width: 128px;
      height: 128px;
      image-rendering: auto;
    }

    .size-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #71808c;
      font-size: 12px;
    }

    .size-label img {
      width: 32px;
      height: 32px;
    }

    @media (max-width: 680px) {
      body { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>浅色系 icon 候选</h1>
    <p>四个方案都保留当前终端图形。每张卡片左侧是浅色背景，右侧是深色背景；下方展示 32px 工具栏尺寸。</p>
    <section class="grid">
      <article class="candidate">
        <h2>1. Ice Cyan / 冰青</h2>
        <div class="swatches">
          <svg class="icon" viewBox="0 0 128 128" aria-label="Ice Cyan icon">
            <rect x="5" y="5" width="118" height="118" rx="22" fill="#dff8f8" stroke="#153b4a" stroke-width="6"/>
            <circle cx="30" cy="31" r="5" fill="#153b4a"/><circle cx="48" cy="31" r="5" fill="#153b4a"/>
            <path d="M31 51 L51 68 L31 85" fill="none" stroke="#153b4a" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
            <rect x="61" y="77" width="38" height="9" rx="2" fill="#13a9ad"/>
          </svg>
          <svg class="icon" viewBox="0 0 128 128" aria-label="Ice Cyan icon on dark background">
            <rect x="5" y="5" width="118" height="118" rx="22" fill="#dff8f8" stroke="#153b4a" stroke-width="6"/>
            <circle cx="30" cy="31" r="5" fill="#153b4a"/><circle cx="48" cy="31" r="5" fill="#153b4a"/>
            <path d="M31 51 L51 68 L31 85" fill="none" stroke="#153b4a" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#13a9ad"/>
          </svg>
        </div>
        <div class="size-label">32px preview <svg width="32" height="32" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#dff8f8" stroke="#153b4a" stroke-width="6"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#153b4a" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#13a9ad"/></svg></div>
      </article>

      <article class="candidate">
        <h2>2. Warm Ivory / 象牙白</h2>
        <div class="swatches">
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fff8df" stroke="#4b3b16" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#4b3b16"/><circle cx="48" cy="31" r="5" fill="#4b3b16"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4b3b16" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#d28b19"/></svg>
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fff8df" stroke="#4b3b16" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#4b3b16"/><circle cx="48" cy="31" r="5" fill="#4b3b16"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4b3b16" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#d28b19"/></svg>
        </div>
        <div class="size-label">32px preview <svg width="32" height="32" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fff8df" stroke="#4b3b16" stroke-width="6"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4b3b16" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#d28b19"/></svg></div>
      </article>

      <article class="candidate">
        <h2>3. Mint / 薄荷</h2>
        <div class="swatches">
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#e7f8ec" stroke="#16472e" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#16472e"/><circle cx="48" cy="31" r="5" fill="#16472e"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#16472e" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#2fa866"/></svg>
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#e7f8ec" stroke="#16472e" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#16472e"/><circle cx="48" cy="31" r="5" fill="#16472e"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#16472e" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#2fa866"/></svg>
        </div>
        <div class="size-label">32px preview <svg width="32" height="32" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#e7f8ec" stroke="#16472e" stroke-width="6"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#16472e" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#2fa866"/></svg></div>
      </article>

      <article class="candidate">
        <h2>4. Lemon / 柠檬</h2>
        <div class="swatches">
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fffbd8" stroke="#4a4311" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#4a4311"/><circle cx="48" cy="31" r="5" fill="#4a4311"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4a4311" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#c2a51a"/></svg>
          <svg class="icon" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fffbd8" stroke="#4a4311" stroke-width="6"/><circle cx="30" cy="31" r="5" fill="#4a4311"/><circle cx="48" cy="31" r="5" fill="#4a4311"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4a4311" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#c2a51a"/></svg>
        </div>
        <div class="size-label">32px preview <svg width="32" height="32" viewBox="0 0 128 128"><rect x="5" y="5" width="118" height="118" rx="22" fill="#fffbd8" stroke="#4a4311" stroke-width="6"/><path d="M31 51 L51 68 L31 85" fill="none" stroke="#4a4311" stroke-width="9"/><rect x="61" y="77" width="38" height="9" rx="2" fill="#c2a51a"/></svg></div>
      </article>
    </section>
  </main>
</body>
</html>
