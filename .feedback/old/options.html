<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Site2LLM icon options</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; background: #10101d; color: #f4f1ff; }
    body { margin: 0; padding: 40px 24px; }
    main { max-width: 920px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; }
    p { margin: 0 0 28px; color: #aaa5bd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
    article { padding: 18px; background: #19182b; border: 1px solid #34314b; border-radius: 8px; }
    .hero { display: block; width: 128px; height: 128px; margin: 8px auto 20px; }
    .small { display: flex; align-items: center; gap: 10px; color: #aaa5bd; font: 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .small img { width: 16px; height: 16px; image-rendering: auto; }
    h2 { margin: 0 0 5px; font: 600 15px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; color: #55e6c1; }
    .note { margin-top: 28px; color: #77738a; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Coding Site2LLM icon options</h1>
    <p>Four directions using the existing violet, mint, and ink palette.</p>
    <section class="grid">
      <article><img class="hero" src="option-a-bridge.svg" alt="Bridge icon"><h2>A / Bridge</h2><div class="small"><img src="option-a-bridge.svg" alt="">16px toolbar preview</div></article>
      <article><img class="hero" src="option-b-prompt.svg" alt="Prompt icon"><h2>B / Prompt</h2><div class="small"><img src="option-b-prompt.svg" alt="">16px toolbar preview</div></article>
      <article><img class="hero" src="option-c-flow.svg" alt="Flow icon"><h2>C / Flow</h2><div class="small"><img src="option-c-flow.svg" alt="">16px toolbar preview</div></article>
      <article><img class="hero" src="option-d-terminal.svg" alt="Terminal icon"><h2>D / Terminal</h2><div class="small"><img src="option-d-terminal.svg" alt="">16px toolbar preview</div></article>
    </section>
    <div class="note">D / Terminal is active in the extension PNG icons.</div>
  </main>
</body>
</html>
